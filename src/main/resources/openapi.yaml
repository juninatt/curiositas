openapi: 3.0.3

info:
  title: Curiositas API
  version: '1'
  description: |
    A curated, versioned dataset of history, from antiquity to modern times, with honest
    uncertainty. It starts with historical people. The API is meant for any client, whether it
    loads the data once or keeps in sync with it.

    **Reading** is open to everyone. **Writing** (POST, PUT, DELETE) requires authentication.

    **Errors** are returned as Problem Details (RFC 9457) with the media type
    `application/problem+json`.

    **Unknown values are left out** of responses instead of being returned as `null`.

    **Dates** are only as precise as their source: a year, with an optional month and day, and an
    uncertainty in years for approximate dates (for example 1680 ± 5). Years are astronomical:
    year 0 is 1 BC and year -43 is 44 BC. Dates are stored as the source gives them, without
    converting between the Julian and Gregorian calendars.

    **Concurrent updates** are detected with ETags: every person is returned with an `ETag`
    header, which must be sent back in `If-Match` when the person is replaced.

    **Compatibility.** Within version 1 the API only grows; nothing a client relies on is renamed,
    removed or given another meaning. Clients must therefore accept that:

    - responses get new fields; ignore the fields you do not know
    - enumerations, such as `gender` or the type of a name, get new values; treat an unknown value
      as "other" instead of failing
    - display texts, such as `display` of a date, may be worded differently in a later release;
      show them, but never parse them, and calculate with `year`, `month` and `day` instead

servers:
  - url: /api/v1

tags:
  - name: Persons
    description: Historical people
  - name: Dataset
    description: |
      The whole dataset at once, for clients that keep their own copy: load the snapshot once,
      then stay in sync with the changes made after its version

paths:
  /persons:
    get:
      tags: [ Persons ]
      operationId: listPersons
      summary: List persons
      description: |
        Returns one page of persons, ordered by name. Send the ETag of an earlier response in
        `If-None-Match` to get 304 Not Modified instead, when nothing in the dataset has changed.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: One page of persons
          headers:
            ETag:
              $ref: '#/components/headers/DatasetETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
        '304':
          $ref: '#/components/responses/DatasetNotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    post:
      tags: [ Persons ]
      operationId: createPerson
      summary: Create a person
      security:
        - basicAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: The person was created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /persons/{id}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [ Persons ]
      operationId: getPerson
      summary: Get a person
      description: |
        Send the ETag of an earlier response in `If-None-Match` to get 304 Not Modified instead,
        when the person has not changed.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The person
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '304':
          description: The person has not changed since the response with this ETag
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '410':
          $ref: '#/components/responses/Gone'
    put:
      tags: [ Persons ]
      operationId: replacePerson
      summary: Replace a person
      description: |
        Replaces all fields of the person. The `If-Match` header must contain the ETag from the
        latest read, so that changes made by someone else in the meantime are never overwritten.
      security:
        - basicAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: The person was replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [ Persons ]
      operationId: deletePerson
      summary: Delete a person
      security:
        - basicAuth: [ ]
      responses:
        '204':
          description: The person was deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '410':
          $ref: '#/components/responses/Gone'

  /snapshot:
    get:
      tags: [ Dataset ]
      operationId: getSnapshot
      summary: Get the whole dataset
      description: |
        Every person as it is now, ordered by name, together with the version of the dataset they
        belong to. The persons and the version are read at the same moment, so a client that
        loads the snapshot and then asks for the changes after its version misses nothing.
        The snapshot is one response however large the dataset grows; to load it in pages
        instead, read the changes after version 0, which hold the whole dataset.
        Send the ETag of an earlier response in `If-None-Match` to get 304 Not Modified instead,
        when nothing has changed.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The whole dataset
          headers:
            ETag:
              $ref: '#/components/headers/DatasetETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSnapshot'
        '304':
          $ref: '#/components/responses/DatasetNotModified'
        '406':
          $ref: '#/components/responses/NotAcceptable'

  /changes:
    get:
      tags: [ Dataset ]
      operationId: listChanges
      summary: List the changes after a version
      description: |
        Every change made after the given version, in the order they were committed, including
        deletions. Apply them in order to a copy loaded from the snapshot, then ask again with
        the returned version. A change is never added later before one already returned, so
        nothing is missed. Each change shows the person exactly as the person endpoints showed
        it after the change; a deletion only names the person.
      parameters:
        - name: after
          in: query
          description: |
            The version the client already has: the version of its snapshot, or of the last
            changes it applied. 0 gives every change from the start. A version beyond the latest
            is answered with 400, since such a copy cannot come from this dataset; load the
            snapshot again.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: The most changes to return at once
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: The changes after the version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeFeed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'

  /persons/{id}/revisions:
    parameters:
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [ Persons ]
      operationId: listPersonRevisions
      summary: List the revisions of a person
      description: |
        Every change ever made to the person, oldest first, each with the whole person as it was
        after the change. Deleted persons keep their revisions; the last one is the deletion,
        holding the person as it was before it.

        A revision holds the person as stored facts, in the form a client sends, without derived
        values such as `display` or `ageAtDeath`. Those are calculated anew on every read and may
        improve between releases, so they are not part of the history.
      responses:
        '200':
          description: The revisions of the person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonRevisionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Required for all write operations.

  parameters:
    PersonId:
      name: id
      in: path
      required: true
      description: The id of the person
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: The page number, starting at 0
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: The number of persons per page
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The ETag of an earlier response; if nothing has changed, the answer is 304 without a body
      schema:
        type: string
      example: '"3"'
    IfMatch:
      name: If-Match
      in: header
      # Not required here, so that a missing header gets the more precise 428 instead of 400.
      required: false
      description: The ETag from the latest read of the person. Required; without it the response is 428.
      schema:
        type: string
      example: '"3"'

  headers:
    DatasetETag:
      description: |
        The version of the dataset and of the application, to send back in `If-None-Match`. It
        changes with every change to the data and with every release.
      schema:
        type: string
      example: '"57-0.7.0"'
    ETag:
      description: The current version of the person, to send back in `If-Match`
      schema:
        type: string
      example: '"3"'
    Location:
      description: The URL of the created person
      schema:
        type: string
        format: uri

  responses:
    DatasetNotModified:
      description: Nothing has changed since the response with this ETag
      headers:
        ETag:
          $ref: '#/components/headers/DatasetETag'
    BadRequest:
      description: The request could not be read, for example malformed JSON or an invalid parameter
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing or wrong
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No person with that id has ever existed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Another person is already registered with the same Wikidata id, or, when there is no
        Wikidata id, with the same name, birth, death and birth country
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotAcceptable:
      description: |
        None of the media types in the `Accept` header can be sent; accept `application/json`
        for data and `application/problem+json` for errors
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: |
        The person has been deleted. Its history can still be read at
        `/persons/{id}/revisions`; clients keeping a copy of the data should remove the person.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The person has been changed since it was read; read it again and retry
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: |
        The request was understood but describes something impossible, for example a date that
        does not exist or a death that can only have happened before the birth
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: The `If-Match` header is missing
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    PersonInput:
      type: object
      description: A person as sent by the client. Derived values are never sent; the server calculates them.
      required: [ name, gender ]
      properties:
        wikidataId:
          type: string
          description: The person's item id in Wikidata. Unique among all persons.
          pattern: '^Q[1-9][0-9]*$'
          example: Q7259
        name:
          type: string
          description: The name the person is most commonly known by
          minLength: 1
          maxLength: 200
          example: Edward Teach
        alsoKnownAs:
          type: array
          description: Other names of the person
          items:
            $ref: '#/components/schemas/AlternativeName'
        birth:
          $ref: '#/components/schemas/HistoricalDateInput'
        death:
          $ref: '#/components/schemas/HistoricalDateInput'
        floruit:
          $ref: '#/components/schemas/HistoricalDateInput'
        birthPlace:
          type: string
          description: |
            The place of birth as the source names it, with how sure the source is in words when
            it says, such as "possibly Kinsale"
          maxLength: 200
          example: Bristol
        deathPlace:
          type: string
          description: The place of death as the source names it, like `birthPlace`
          maxLength: 200
          example: Ocracoke Island
        birthCountry:
          type: string
          description: The modern country of birth, as an ISO 3166-1 alpha-2 code
          pattern: '^[A-Z]{2}$'
          example: GB
        gender:
          $ref: '#/components/schemas/Gender'

    Person:
      type: object
      description: A person as returned by the server, including derived values.
      required: [ id, name, alsoKnownAs, gender, createdAt, updatedAt ]
      properties:
        id:
          type: string
          format: uuid
        wikidataId:
          type: string
          example: Q7259
        name:
          type: string
          example: Edward Teach
        alsoKnownAs:
          type: array
          items:
            $ref: '#/components/schemas/AlternativeName'
        birth:
          $ref: '#/components/schemas/HistoricalDate'
        death:
          $ref: '#/components/schemas/HistoricalDate'
        floruit:
          $ref: '#/components/schemas/HistoricalDate'
        ageAtDeath:
          $ref: '#/components/schemas/AgeRange'
        birthPlace:
          type: string
          description: |
            The place of birth as the source names it, with how sure the source is in words when
            it says, such as "possibly Kinsale"
          example: Bristol
        deathPlace:
          type: string
          description: The place of death as the source names it, like `birthPlace`
          example: Ocracoke Island
        birthCountry:
          $ref: '#/components/schemas/Country'
        gender:
          $ref: '#/components/schemas/Gender'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonPage:
      type: object
      description: One page of persons
      required: [ content, page, size, totalElements, totalPages ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        page:
          type: integer
          format: int32
          description: The page number, starting at 0
        size:
          type: integer
          format: int32
          description: The requested number of persons per page
        totalElements:
          type: integer
          format: int64
          description: The number of persons on all pages
        totalPages:
          type: integer
          format: int32

    DatasetSnapshot:
      type: object
      description: The whole dataset at one version
      required: [ version, persons ]
      properties:
        version:
          type: integer
          format: int64
          description: |
            The sequence number of the latest change included, or 0 for an empty dataset. Ask for
            the changes after it to stay in sync.
          minimum: 0
          example: 57
        persons:
          type: array
          description: Every person, ordered by name
          items:
            $ref: '#/components/schemas/Person'

    ChangeFeed:
      type: object
      description: Changes made after a version, oldest first
      required: [ changes, version, hasMore ]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        version:
          type: integer
          format: int64
          description: The version a copy has after applying these changes; send it as `after` next time
          minimum: 0
          example: 60
        hasMore:
          type: boolean
          description: Whether more changes are waiting; if so, ask again right away

    Change:
      type: object
      description: One change to the dataset
      required: [ sequenceNumber, recordType, id, change, source, changedAt ]
      properties:
        sequenceNumber:
          type: integer
          format: int64
          description: The position of this change among all changes; also the version after it
          example: 58
        recordType:
          $ref: '#/components/schemas/RecordType'
        id:
          type: string
          format: uuid
          description: The id of the record that changed
        change:
          $ref: '#/components/schemas/ChangeType'
        source:
          $ref: '#/components/schemas/ChangeSource'
        changedAt:
          type: string
          format: date-time
        person:
          $ref: '#/components/schemas/Person'

    RecordType:
      type: string
      description: The kind of record a change concerns; more kinds will be added
      enum: [ PERSON ]

    PersonRevisionList:
      type: object
      description: The full history of one person
      required: [ personId, revisions ]
      properties:
        personId:
          type: string
          format: uuid
        revisions:
          type: array
          description: Every revision, oldest first
          items:
            $ref: '#/components/schemas/PersonRevision'

    PersonRevision:
      type: object
      description: One change to a person, with the whole person as it was after the change
      required: [ sequenceNumber, revision, change, source, changedAt, person ]
      properties:
        sequenceNumber:
          type: integer
          format: int64
          description: The position of this change among all changes in the dataset
          example: 57
        revision:
          type: integer
          format: int32
          description: The position of this change among the changes to this person, starting at 1
          minimum: 1
          example: 2
        change:
          $ref: '#/components/schemas/ChangeType'
        source:
          $ref: '#/components/schemas/ChangeSource'
        changedAt:
          type: string
          format: date-time
        person:
          $ref: '#/components/schemas/PersonInput'

    ChangeType:
      type: string
      description: What the change did; a deletion holds the person as it was before it
      enum: [ CREATED, UPDATED, DELETED ]

    ChangeSource:
      type: string
      description: |
        Where the change came from: the REST API, an import of the data files in the repository,
        or Wikidata directly. Persons fetched from Wikidata are reviewed as data files first, so
        their changes come from `IMPORT`; `WIKIDATA` is kept for changes that come straight from it.
      enum: [ API, IMPORT, WIKIDATA ]

    HistoricalDateInput:
      type: object
      description: |
        A date that is only as precise as its source. A day requires a month, and the day must
        exist in that month; 29 February is accepted in every year divisible by four, since older
        sources often use the Julian calendar. Impossible dates are rejected with 422.
      required: [ year ]
      properties:
        year:
          type: integer
          format: int32
          description: The astronomical year; 0 is 1 BC and -43 is 44 BC
          example: 1680
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
        uncertaintyYears:
          type: integer
          format: int32
          description: How many years the date may be off in either direction
          minimum: 0
          default: 0
          example: 5

    HistoricalDate:
      type: object
      description: A date as returned by the server, including a derived display text.
      required: [ year, uncertaintyYears, display ]
      properties:
        year:
          type: integer
          format: int32
          example: 1680
        month:
          type: integer
          format: int32
        day:
          type: integer
          format: int32
        uncertaintyYears:
          type: integer
          format: int32
          example: 5
        display:
          type: string
          description: |
            The date as text, showing only the known parts. Meant to be shown, not parsed; the
            wording may change between releases.
          example: 1680 ± 5

    AgeRange:
      type: object
      description: |
        The youngest and oldest age the person can have reached, in completed years. Left out
        when birth or death is unknown.
      required: [ min, max ]
      properties:
        min:
          type: integer
          format: int32
          minimum: 0
          example: 32
        max:
          type: integer
          format: int32
          minimum: 0
          example: 43

    Country:
      type: object
      description: A modern country
      required: [ code, name ]
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 code
          example: GB
        name:
          type: string
          example: United Kingdom

    AlternativeName:
      type: object
      required: [ name, type ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Blackbeard
        type:
          $ref: '#/components/schemas/NameType'

    NameType:
      type: string
      enum: [ NICKNAME, PEN_NAME, REGNAL_NAME, BIRTH_NAME, SPELLING_VARIANT ]

    Gender:
      type: string
      enum: [ FEMALE, MALE, OTHER, UNKNOWN ]

    Problem:
      type: object
      description: An error as Problem Details (RFC 9457)
      properties:
        type:
          type: string
          description: Identifies the kind of problem; `about:blank` when the status says it all
          format: uri-reference
          default: about:blank
        title:
          type: string
          example: Unprocessable Content
        status:
          type: integer
          format: int32
          example: 422
        detail:
          type: string
          example: Death (1700) cannot be before birth (1718)
        instance:
          type: string
          description: The path of the request that failed, relative to the server
          format: uri-reference
          example: /api/v1/persons/7f1c8a52-0d1e-4f4b-9a7e-3c2b1d0e9f8a
        errors:
          type: array
          description: The fields that failed validation, when there are any
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [ field, message ]
      properties:
        field:
          type: string
          example: birth.month
        message:
          type: string
          example: must be between 1 and 12
